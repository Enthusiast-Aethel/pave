- name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies & Build Web Assets
        run: |
          cd client
          npm install
          npm run build

      - name: Ensure Android Platform & Sync Capacitor
        run: |
          cd client
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Build APK with Gradle
        run: |
          cd client/android
          chmod +x gradlew
          ./gradlew assembleDebug